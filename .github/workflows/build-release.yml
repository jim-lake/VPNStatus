name: Build and Release

# Manually triggered from the Actions tab. Runs `make build-release`, which bumps
# the version, builds the ad-hoc-signed VPNStatus.app, and zips it; this workflow
# then publishes that zip as a GitHub release. All version logic lives in the
# Makefile / Info.plist: CFBundleVersion is the auto-incremented build number and
# CFBundleShortVersionString is <marketing>.<build> (e.g. 3.2.316). The marketing
# base (3.2) is only bumped by hand in VPNStatus/Info.plist.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write access to push the version bump back.
          persist-credentials: true

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and package (make build-release)
        id: package
        run: |
          set -euo pipefail
          # make build-release bumps Info.plist, builds Release, ad-hoc seals the
          # bundle, and writes dist/VPNStatus-<short>-<build>.zip. Keeping the logic
          # in the Makefile avoids duplicating it here.
          make build-release

          PLIST="VPNStatus/Info.plist"
          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          ZIP="dist/VPNStatus-${SHORT}.zip"
          if [ ! -f "$ZIP" ]; then
            echo "error: expected zip not found at $ZIP" >&2
            ls -la dist || true
            exit 1
          fi
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "zip_path=$PWD/$ZIP" >> "$GITHUB_OUTPUT"

      - name: Commit build-number bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VPNStatus/Info.plist
          if git diff --cached --quiet; then
            echo "No version change to commit."
          else
            git commit -m "ci: bump version to ${{ steps.package.outputs.short }} [skip ci]"
            git push
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.short }}
          name: VPNStatus ${{ steps.package.outputs.short }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip_path }}
