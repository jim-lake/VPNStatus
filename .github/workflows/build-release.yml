name: Build and Release

# Manually triggered from the Actions tab. Builds the unsigned VPNStatus.app,
# zips it, and publishes it as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v3.1). Defaults to v<MARKETING_VERSION>-<run number>."
        required: false
        type: string
      prerelease:
        description: "Mark the release as a prerelease."
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (Release, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project VPN.xcodeproj \
            -scheme VPNStatus \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate and package the app
        id: package
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/VPNStatus.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "error: expected app not found at $APP_PATH" >&2
            find build/DerivedData/Build/Products -maxdepth 2 -name '*.app' || true
            exit 1
          fi

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          ZIP_NAME="VPNStatus-${VERSION}.zip"
          # ditto preserves the bundle structure and resource forks correctly.
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_path=$PWD/$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v${{ steps.package.outputs.version }}-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: VPNStatus ${{ steps.package.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.zip_path }}
